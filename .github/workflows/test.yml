name: Tests

on:
  pull_request:
    paths: ["apps/**", "crates/**", "packages/**", ".github/workflows/test.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "crates/**", "packages/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Typecheck and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/nucode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/nucode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    name: Rust tests (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/nucode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: apps/nucode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/nucode/src-tauri
            crates/nucode-diag-mcp
          cache-on-failure: true
      - run: npm ci
      # The Tauri context embeds the built frontend at compile time.
      - run: npm run build
      - name: App tests
        working-directory: apps/nucode/src-tauri
        # The preview-bridge test binds a socket under TMPDIR.
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --lib --locked
      - name: Diagnostics crate tests
        working-directory: crates/nucode-diag-mcp
        run: cargo test --locked
